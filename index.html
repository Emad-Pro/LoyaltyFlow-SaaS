# 4. المقدمة
تفصل وثيقة متطلبات النظام (SRS) هذه المتطلبات الكاملة لـ **LoyaltyFlow SaaS**، وهي منصة ولاء متعددة المستأجرين (Multi-Tenant) على مستوى المؤسسات. تم بناء هذه المنصة للتعامل مع النطاق الواسع، وتمكين الشركات من تشغيل برامج ولاء ومكافآت مخصصة للغاية، بشكل مشابه لـ Smile.io أو Yotpo.

# 5. الغرض
الغرض من هذا المستند هو إرساء الأساس لجميع عمليات التطوير الفنية والمعمارية والتجارية لمنصة LoyaltyFlow SaaS. إنها بمثابة الدليل النهائي لمهندسي البرمجيات ومهندسي DevOps ومديري المنتجات لتنفيذ البناء دون أي غموض.

# 6. النطاق (Scope)
يتضمن النظام واجهة خلفية تعتمد على API (Laravel 12, PHP 8.4, PostgreSQL)، ولوحة تحكم للمسؤول العام (Super Admin)، وبوابات للأعمال والموظفين (React/Vite)، وتطبيقات للهاتف المحمول للمستهلكين والشركات (Flutter). يشمل النطاق العزل بين المستأجرين، ومعالجة المعاملات الضخمة، وتكاملات خطافات الويب (Webhooks)، وتوصيات الذكاء الاصطناعي في الوقت الفعلي.

# 7. أهداف العمل (Business Objectives)
- الاستحواذ على 10% من سوق التجزئة للشركات الصغيرة والمتوسطة في منطقة الشرق الأوسط وشمال أفريقيا خلال 24 شهراً.
- تقديم نهج يعتمد على واجهة برمجة التطبيقات (API-First) يتكامل بسهولة مع Shopify و Salla وأنظمة نقاط البيع مثل Foodics.
- الحفاظ على وقت تشغيل بنسبة 99.99% مع بنية قابلة للتطوير (Database-per-Tenant أو Shared Database مع عزل أمني).

# 8. رؤية المنتج (Product Vision)
أن نكون محرك الولاء الأكثر سهولة للمطورين والأكثر قابلية للتخصيص في العالم، مما يتيح لأي علامة تجارية إطلاق محفظة ونظام مكافآت يحمل علامتها التجارية في أقل من 5 دقائق.

# 9. أصحاب المصلحة (Stakeholders)
- **ملاك المنتج:** تحديد خارطة الطريق والميزات.
- **عملاء المؤسسات:** يطالبون بضمانات اتفاقية مستوى الخدمة (SLA) وعلامة تجارية مخصصة.
- **المستهلكون النهائيون:** يطلبون وصولاً سريعاً وبديهياً للمحفظة عبر الهاتف المحمول.

# 10. التعريفات
- **المستأجر (Tenant):** الشركة التي تشترك في الخدمة (SaaS).
- **المحفظة (Wallet):** حاوية رقمية للنقاط والاسترداد النقدي وبطاقات الطوابع.
- **Reverb:** خادم WebSockets الأصلي الخاص بـ Laravel للأحداث في الوقت الفعلي.

# 11. الافتراضات (Assumptions)
- يمتلك العملاء قدرة تقنية أساسية لتهيئة Webhooks في حال استخدام تكاملات مخصصة.
- يمتلك المستخدمون النهائيون هواتف ذكية قادرة على تخزين بطاقات Apple Wallet / Google Wallet.

# 12. القيود (Constraints)
- يجب أن يمتثل النظام لقوانين حماية البيانات المحلية والعالمية (مثل GDPR و PDPL في السعودية).
- الحد الأقصى لوقت استجابة API هو 200 مللي ثانية في شريحة الـ 95%.

# 13. التبعيات (Dependencies)
- تخزين الكائنات AWS S3.
- بوابات الدفع Stripe / HyperPay للاشتراكات.
- خدمة FCM لإشعارات الدفع (Push Notifications).

# 14. متطلبات العمل (Business Requirements)
- يجب أن تدعم المنصة العضويات القائمة على الفئات (Tiers) مع ترقيات/تخفيضات تلقائية بناءً على تراكم النقاط خلال فترة 12 شهراً متجددة.
- يجب فوترة المستأجرين تلقائياً بناءً على الفئة المختارة (الإيرادات المتكررة الشهرية MRR).

# 15. نظرة عامة على المنتج
تقدم LoyaltyFlow خدمة SaaS بالعلامة البيضاء حيث تقوم الشركات بتهيئة قواعد الاكتساب (مثل 1 دولار = 10 نقاط) وقواعد الإنفاق (مثل 1000 نقطة = خصم 5 دولارات). يمكن للعملاء مسح رموز QR في المتجر أو ربط الحسابات عبر الإنترنت لكسب النقاط.

# 16. شخصيات المستخدمين (User Personas)
- **سارة (المتسوقة):** ترغب في تتبع النقاط بسهولة على هاتفها واستخدامها عند الدفع.
- **أحمد (مالك النشاط):** يرغب في رؤية مقاييس الاحتفاظ بالعملاء وإطلاق حملات SMS مستهدفة للعملاء المعرضين للتسرب.
- **جون (الكاشير):** يحتاج إلى طريقة سريعة بخطوتين لمسح رمز الاستجابة السريعة (QR) الخاص بالعميل وتطبيق الخصم على نظام نقاط البيع (POS).

# 17. رحلة العميل (Customer Journey)
1. **الاكتشاف:** يرى العميل رمز QR عند الكاشير.
2. **التسجيل:** يمسح رمز QR، ويُدخل رقم الهاتف، ويحصل فوراً على 500 نقطة تسجيل.
3. **التفاعل:** يتلقى العميل رسالة WhatsApp في عيد ميلاده مع كوبون خاص.
4. **الاحتفاظ:** يعود العميل لاسترداد الكوبون، مما يعزز الإيرادات المتكررة للشركة.

# 18. سياق النظام (System Context)
تقع المنصة في مركز النظام البيئي للتاجر، وتتواصل مع نقاط البيع (مثل Foodics)، والتجارة الإلكترونية (مثل Shopify)، وبوابات المراسلة (مثل Twilio لـ SMS) عبر واجهات برمجة تطبيقات RESTful و Webhooks.

# 19. البنية التحتية عالية المستوى (High-Level Architecture)
تم تصميم LoyaltyFlow كـ "Monolith المعياري" باستخدام **Laravel 12** مع إمكانية الانتقال إلى الخدمات المصغرة (Service-Oriented). يعتمد النظام على مجموعة **PostgreSQL** عالية التوفر للتخزين الدائم، و **Redis** للتخزين المؤقت وإدارة الجلسات وقوائم الانتظار.

# 20. الخدمات المصغرة مقابل المنظومة المعيارية (Microservices vs Modular Monolith)
لمنع التحسين المبكر، تم تصميم النظام باستخدام **التصميم الموجه بالمجال (DDD)** داخل Monolith معياري.
يتم عزل المجالات (مثل المصادقة، الولاء، الفوترة) بشكل صارم وتتواصل عبر كائنات نقل البيانات (DTOs) ومرسلات الأحداث الداخلية. إذا كانت الوحدة (مثل Webhooks) تتطلب توسعاً مستقلاً، يمكن فصلها بسلاسة إلى خدمة مصغرة منفصلة في Laravel.

# 21. بنية النشر (Deployment Architecture)
يتم وضع المنصة بالكامل في حاويات باستخدام **Docker** ويتم تنسيقها عبر **Kubernetes (EKS)**.
- **Ingress:** متحكم NGINX Ingress.
- **الحوسبة (Compute):** مجموعات عقد ذات توسع تلقائي.
- **البيانات (Data):** Amazon RDS لـ PostgreSQL (مناطق توافر متعددة).
- **مهام الخلفية:** Laravel Horizon لإدارة كبسولات العمال القابلة للتوسع.

# 22. التصميم الموجه بالمجال (Domain Driven Design)
ينقسم النظام إلى السياقات المحددة التالية (Bounded Contexts):
1. **سياق الهوية والوصول:** إعداد المستأجر، مصادقة المستخدم، الأدوار، و RBAC.
2. **سياق محرك الولاء:** دفتر الأستاذ للنقاط، قواعد المكافآت، والفئات (Tiers).
3. **سياق المشاركة:** الحملات، إشعارات الدفع، وتوجيه الرسائل النصية.
4. **سياق الفوترة:** الاشتراكات، الفواتير، وبوابات الدفع.

# 39. الأمان (Security)
- **OWASP Top 10:** الالتزام بالتنظيف الصارم، والاستعلامات ذات المعلمات (Eloquent ORM)، وحماية XSS.
- **عزل المستأجر (Tenant Isolation):** مفروض على مستوى قاعدة البيانات عبر أمان مستوى الصف في PostgreSQL (RLS) وسمات Eloquent العامة (\`tenant_id\`).
- **المصادقة:** رموز JWT عديمة الحالة لواجهات API عبر Laravel Sanctum.
- **الحد من المعدل (Rate Limiting):** يُدار عبر Redis، 60 طلباً/دقيقة لواجهات API القياسية، وديناميكي لكل خطة مستأجر.

# 40. المراقبة (Monitoring)
- **أداء التطبيق:** Laravel Pulse و New Relic.
- **تتبع الأخطاء:** دمج Sentry للحصول على تتبعات التكدس في الوقت الفعلي.
- **المقاييس (Metrics):** جمع مقاييس Prometheus المخصصة، ويتم عرضها في Grafana.

# 41. التكامل/التسليم المستمر (CI/CD)
**خط أنابيب GitHub Actions:**
1. **Lint & Static Analysis:** باستخدام PHPStan على المستوى 8 و Pint.
2. **الاختبار:** PHPUnit (وحدات وميزات).
3. **البناء:** إنشاء صورة Docker ورفعها إلى ECR.
4. **النشر:** تحديثات بيان Kustomize إلى EKS.

# 42. الاختبار (Testing)

- **اختبار الحمل:** نصوص K6 تحاكي 10,000 عملية مسح لرموز الاستجابة السريعة في نفس الوقت.

# 43. مواصفات واجهة المستخدم (UI Specification)

## 43.1 لوحة تحكم المسؤول العام (Super Admin Dashboard)
**الغرض:** الإدارة الشاملة لجميع مستأجري (Tenants) الخدمة (SaaS)، الفواتير، والمقاييس على مستوى النظام.
- **شاشة تسجيل الدخول:** تتطلب البريد الإلكتروني، كلمة المرور، والمصادقة الثنائية (TOTP 2FA) الإلزامية.
- **الصفحة الرئيسية:** تعرض الإيرادات المتكررة الشهرية (MRR) الإجمالية، والمستأجرين النشطين، ومعدل التسرب (Churn)، ومعدلات أخطاء API.
- **نافذة إدارة المستأجر:** تسمح بانتحال شخصية المستأجر للدعم الفني، أو إيقاف الفوترة مؤقتاً، أو ترقية الخطط.

## 43.2 لوحة تحكم مالك النشاط (Business Owner Dashboard)
**الغرض:** الواجهة الأساسية للتجار لتهيئة محرك الولاء الخاص بهم.
- **أداة بناء الحملات:** أداة بناء مسارات سير العمل بالسحب والإفلات.
  - *عقدة التشغيل (Trigger):* مثل "لم يقم العميل بزيارة المتجر منذ 30 يوماً"
  - *عقدة الإجراء (Action):* مثل "أرسل رسالة نصية قصيرة تحتوي على كوبون خصم 20%"
- **عرض التحليلات:** خرائط حرارية لزيارات المتجر، رسوم بيانية للاحتفاظ بالعملاء (Cohort)، والبيانات الديموغرافية.
- **التحقق (Validation):** تستخدم جميع نماذج الإعدادات التحقق القوي من جانب العميل (Yup/Zod) قبل إرسال البيانات إلى واجهة برمجة التطبيقات.

## 43.3 واجهة الكاشير / نقاط البيع (Cashier / POS View)
**الغرض:** عمليات سريعة وغير مزعجة عند نقطة الدفع.
- **الإجراء:** يُدخل الكاشير إجمالي مبلغ الفاتورة.
- **الإجراء:** ينقر على "مسح رمز الولاء".
- **النتيجة:** يطبق الخصم ديناميكياً أو يضيف النقاط إلى محفظة العميل.

# 44. مواصفات تطبيق Flutter (للعميل والتاجر)

## 44.1 بنية تطبيق الهاتف (Mobile Architecture)
- **إدارة الحالة (State Management):** استخدام BLoC أو Riverpod لمعالجة الحالة بشكل يمكن التنبؤ به.
- **الشبكات (Networking):** استخدام Dio مع معترضات (Interceptors) للتحديث التلقائي لرموز JWT.

## 44.2 ميزات تطبيق العميل (Customer App)
- **عرض المحفظة:** يعرض النقاط الحالية، الفئة الحالية (مثل "عضو ذهبي")، ورمز استجابة سريعة (QR) ديناميكي قابل للمسح. يتجدد الرمز كل 30 ثانية للأمان ضد الاحتيال عبر لقطات الشاشة.
- **وضع عدم الاتصال (Offline Mode):** تخزن المحفظة آخر رصيد نقاط معروف وحمولة QR آمنة يمكن التحقق منها دون اتصال بالإنترنت حتى يتمكن المستخدمون من كسب النقاط دون الحاجة لبيانات خلوية.
- **إشعارات الدفع (Push Notifications):** تقوم بالتوجيه العميق (Deep-link) مباشرة إلى العروض الخاصة عند النقر عليها.
- **التكامل مع Apple/Google Wallet:** يسمح للمستخدمين بتصدير بطاقة الولاء الخاصة بهم مباشرة إلى محافظ نظام التشغيل الأصلية عبر إنشاء ملف \`.pkpass\` القياسي في الخلفية.

## 44.3 ميزات تطبيق التاجر (Business App)
- **وضع نقطة البيع المتنقلة (Mobile POS Mode):** يحول الهاتف الذكي للموظف إلى ماسح ضوئي للولاء. يستخدم كاميرا الجهاز لمسح رموز QR الخاصة بالعملاء بسرعة.
- **البث المباشر:** يعرض بثاً في الوقت الفعلي لعمليات الاسترداد (Redemptions) التي تحدث في المتجر.

# 45. التحليلات ومؤشرات الأداء (Analytics & KPIs)
لضمان نجاح المستأجرين، تقوم المنصة بتتبع المقاييس القياسية لـ SaaS والمقاييس الخاصة بالولاء:
- **MRR / ARR:** يتم تتبع الإيرادات المتكررة الشهرية والسنوية عالمياً في لوحة تحكم المسؤول العام.
- **القيمة الدائمة للعميل (LTV):** تُحسب لكل عميل لدى كل مستأجر بناءً على سجل المشتريات.
- **معدل التسرب (Churn Rate):** يحدد العملاء الذين لم يجروا معاملات خلال X يوماً مقارنة بمتوسط وتيرة زياراتهم.
- **معدل التكرار (Repeat Rate):** النسبة المئوية للمستخدمين الذين يعودون بعد المسح الأول.

# 46. خارطة الطريق (Roadmap)
- **المنتج القابل للتطبيق (MVP) (الأشهر 1-4):** دفتر النقاط والمكافآت الأساسي، لوحة تحكم الويب، واجهة برمجة تطبيقات مبدئية لنقاط البيع.
- **الإصدار الثاني (الأشهر 5-8):** إطلاق تطبيقات Flutter، التكامل مع Apple/Google Wallet، وخطافات الويب (Webhooks).
- **الإصدار الثالث (الأشهر 9-12):** أداة بناء الحملات بالسحب والإفلات، محرك توصيات الذكاء الاصطناعي.
- **نسخة المؤسسات (السنة الثانية):** تجزئة قاعدة البيانات (Sharding) لكل مستأجر، تطبيقات بالعلامة البيضاء للعلامات التجارية الكبرى.

# 47. تخطيط السبرنت (Agile Sprint Planning)
بافتراض أن السبرنت يستغرق أسبوعين:
- **السبرنت 1-2:** التأسيس. إعداد Docker, EKS, CI/CD، إنشاء مخطط قاعدة البيانات، المصادقة (Sanctum).
- **السبرنت 3-4:** تسجيل المستأجرين، فوترة الاشتراكات (Stripe)، واجهة المستخدم للمسؤول العام.
- **السبرنت 5-6:** محرك الولاء (النقاط، القواعد، مشغلات قاعدة البيانات).
- **السبرنت 7-8:** إدارة علاقات العملاء (CRM)، شرائح العملاء، واجهة التاجر.
- **السبرنت 9-10:** بوابة واجهة برمجة التطبيقات (API Gateway)، تكاملات Foodics/Shopify.
- **السبرنت 11-12:** تطوير تطبيق الهاتف المحمول Flutter (محفظة العميل).

# 48. تقدير التكلفة (Cost Estimation)
- **ساعات التطوير:** حوالي 2,500 ساعة للوصول إلى الإصدار الأول.
- **هيكل الفريق:** 1 مدير منتج، 1 مصمم واجهات (UI/UX)، 2 مطورين خلفية (Laravel)، 2 مطورين واجهة (React)، 1 مطور تطبيقات محمولة (Flutter)، 1 مهندس DevOps.
- **الجدول الزمني:** 6 أشهر حتى إطلاق MVP.
- **البنية التحتية (AWS):** تبدأ من حوالي 800 دولار شهرياً (EKS, RDS, ElastiCache, WAF).

# 49. تحليل المخاطر (Risk Analysis)
- **الخطر:** ضغط عالي متزامن خلال عروض الجمعة السوداء مما يتسبب في إقفال قاعدة البيانات (DB Locks).
  - **التخفيف:** استخدام Redis لوضع عمليات النقاط في طابور انتظار ومعالجتها بشكل غير متزامن. تجنب عمليات الحفظ المتزامنة في قاعدة البيانات أثناء ذروة المرور.
- **الخطر:** الاحتيال على النقاط عبر تسريب رموز الاستجابة السريعة (QR).
  - **التخفيف:** تحتوي حمولات QR على طوابع زمنية ورموز مؤقتة دوارة (Nonces) صالحة لمدة 30 ثانية فقط.
- **الخطر:** تغييرات في واجهة برمجة التطبيقات (API) الخاصة بأنظمة نقاط البيع للجهات الخارجية.
  - **التخفيف:** تعيين إصدارات صارمة واستخدام أنماط طبقة مكافحة الفساد (Anti-Corruption Layer).

# 50. التحسينات المستقبلية (Future Enhancements)
- **التلعيب (Gamification):** لوحات الصدارة (Leaderboards)، وبطاقات "اخدش واربح" الرقمية.
- **الولاء الائتلافي (Coalition Loyalty):** السماح لمتاجر مستقلة متعددة في مركز تجاري بمشاركة نظام نقاط موحد.
- **العملات المشفرة / Web3:** سك عضويات الفئات العليا كرموز غير قابلة للاستبدال (NFTs).

يوضح هذا القسم أكثر من 300 قاعدة أعمال أساسية تملي سلوك المنصة.

- **BR-001**: لا يمكن معالجة المصادقة (Authentication) إذا كان اشتراك المستأجر (Tenant) غير نشط.

- **BR-002**: عند تحديث المصادقة (Authentication)، يجب تسجيل العملية بشكل آمن في سجلات التدقيق (Audit Logs).

- **BR-003**: المدير العام (Super Admin) فقط هو من يمتلك صلاحية الحذف النهائي (Hard Delete) في المصادقة (Authentication).

# 30. حالات الاستخدام (Use Cases)

يفصل هذا القسم أكثر من 150 حالة استخدام مهيكلة للتفاعلات مع النظام.


### UC-001: إنشاء في المصادقة (Authentication)
- **الجهات الفاعلة (Actors):** المدير، مالك النشاط
- **الشروط المسبقة:** المستخدم مسجل الدخول، يمتلك صلاحية \`المصادقة.إنشاء\`، واشتراك المستأجر نشط.
- **التدفق (Flow):** 
  1. ينتقل المستخدم إلى لوحة تحكم المصادقة (Authentication).
  2. يختار المستخدم إجراء 'إنشاء'.
  3. يتحقق النظام من صحة البيانات المدخلة والصلاحيات.
  4. يعالج النظام إجراء 'إنشاء' لـ المصادقة (Authentication).
  5. يُرجع النظام رسالة نجاح.
- **التدفق البديل:** إذا كانت البيانات المدخلة غير صالحة، يبرز النظام الحقول الخاطئة ويطلب التصحيح.
- **الاستثناءات:** إذا انقطع الاتصال بقاعدة البيانات، يعرض النظام خطأ 500 ويسجله في Sentry.
- **شروط ما بعد التنفيذ:** يتم تعديل حالة المصادقة (Authentication) بشكل مناسب، وكتابة سجل التدقيق، وإطلاق Webhooks ذات الصلة.

- **الجهات الفاعلة (Actors):** المدير، مالك النشاط
- **الشروط المسبقة:** المستخدم مسجل الدخول، يمتلك صلاحية \`المصادقة.حذف\`، واشتراك المستأجر نشط.
- **التدفق (Flow):** 
  1. ينتقل المستخدم إلى لوحة تحكم المصادقة (Authentication).
  2. يختار المستخدم إجراء 'حذف'.
  3. يتحقق النظام من صحة البيانات المدخلة والصلاحيات.
  4. يعالج النظام إجراء 'حذف' لـ المصادقة (Authentication).
  5. يُرجع النظام رسالة نجاح.
- **التدفق البديل:** إذا كانت البيانات المدخلة غير صالحة، يبرز النظام الحقول الخاطئة ويطلب التصحيح.
- **الاستثناءات:** إذا انقطع الاتصال بقاعدة البيانات، يعرض النظام خطأ 500 ويسجله في Sentry.
- **شروط ما بعد التنفيذ:** يتم تعديل حالة المصادقة (Authentication) بشكل مناسب، وكتابة سجل التدقيق، وإطلاق Webhooks ذات الصلة.

- **الشروط المسبقة:** المستخدم مسجل الدخول، يمتلك صلاحية \`الاسترداد.موافقة\`، واشتراك المستأجر نشط.
- **التدفق (Flow):** 
  1. ينتقل المستخدم إلى لوحة تحكم الاسترداد النقدي (Cashback).
  2. يختار المستخدم إجراء 'موافقة'.
  3. يتحقق النظام من صحة البيانات المدخلة والصلاحيات.
  4. يعالج النظام إجراء 'موافقة' لـ الاسترداد النقدي (Cashback).
  5. يُرجع النظام رسالة نجاح.
- **التدفق البديل:** إذا كانت البيانات المدخلة غير صالحة، يبرز النظام الحقول الخاطئة ويطلب التصحيح.
- **الاستثناءات:** إذا انقطع الاتصال بقاعدة البيانات، يعرض النظام خطأ 500 ويسجله في Sentry.
- **شروط ما بعد التنفيذ:** يتم تعديل حالة الاسترداد النقدي (Cashback) بشكل مناسب، وكتابة سجل التدقيق، وإطلاق Webhooks ذات الصلة.

# 35. جداول قاعدة البيانات (Database Tables)

يفصل هذا القسم تعريفات العلاقات والكيانات (ERD) لقاعدة بيانات PostgreSQL.


### الجدول: \`tenants\` (المستأجرين)
**الوصف:** يخزن سجلات المستأجرين.
**القيود (Constraints):** تتالي المفاتيح الأجنبية (Cascade) عند حذف المستأجر (Tenant).
**الفهارس (Indexes):** فهرس B-Tree على \`tenant_id\` و \`created_at\`.
**المشغلات (Triggers):** تحديث عمود \`updated_at\` قبل كل عملية UPDATE.

| العمود (Column) | النوع (Type) | القيود (Constraints) | الوصف (Description) |
|---|---|---|---|
| id | UUID | PRIMARY KEY | المعرف الفريد |
| tenant_id | UUID | FOREIGN KEY | يرتبط بـ \`tenants.id\` |
| status | VARCHAR(50) | NOT NULL | حالة السجل |
| metadata | JSONB | NULL | مخطط ديناميكي إضافي |
| created_at | TIMESTAMP | DEFAULT NOW() | وقت الإنشاء |
| updated_at | TIMESTAMP | DEFAULT NOW() | وقت آخر تحديث |
| deleted_at | TIMESTAMP | NULL | علامة الحذف الناعم (Soft Delete) |

# 36. توثيق واجهة برمجة التطبيقات (API Documentation)

يغطي هذا القسم نقاط اتصال RESTful API المتاحة عاماً وخاصاً.


### \`GET /api/v1/tenants\`
